<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>South Boston Barbershop | Premium Men's Grooming</title>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700&family=Cabinet+Grotesk:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #121212; --text: #e0e0e0; --accent: #3498db; }
        body { background: var(--bg); color: var(--text); font-family: 'Cabinet Grotesk', sans-serif; margin: 0; display: flex; align-items: center; justify-content: center; min-height: 100vh; text-align: center; }
        .container { padding: 2rem; max-width: 600px; }
        h1 { font-family: 'Syne', sans-serif; font-size: 4rem; margin: 0; text-transform: uppercase; letter-spacing: 2px; }
        p { font-size: 1.2rem; line-height: 1.6; opacity: 0.8; }
        .cta { margin-top: 2rem; display: inline-block; padding: 1rem 2rem; border: 1px solid var(--text); color: var(--text); text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <h1>South Boston Barbershop</h1>
        <p>Precision cuts and traditional shaves in the heart of Southie. The neighborhood's premier destination for modern grooming.</p>
        <a href="#" class="cta">Book Appointment</a>
    </div>
</body>
</html>
