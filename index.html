<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Third Polar Arch</title>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{--bg:#0c0c0c;--fg:#f0ede8;--muted:#888;--border:rgba(240,237,232,0.12)}
    html,body{height:100%;background:var(--bg);color:var(--fg);font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
    body{display:flex;flex-direction:column;justify-content:center;align-items:center;min-height:100vh;padding:40px 24px;text-align:center}
    .wordmark{font-size:clamp(11px,1.4vw,14px);font-weight:500;letter-spacing:.22em;text-transform:uppercase;color:var(--fg);margin-bottom:48px;opacity:.9}
    .divider{width:1px;height:64px;background:var(--border);margin:0 auto 48px}
    h1{font-size:clamp(28px,5vw,52px);font-weight:300;letter-spacing:-.02em;line-height:1.15;color:var(--fg);max-width:640px;margin-bottom:16px}
    h1 strong{font-weight:600}
    .sub{font-size:clamp(14px,1.8vw,17px);color:var(--muted);font-weight:400;letter-spacing:.01em;margin-bottom:56px;max-width:480px}
    .cta-group{display:flex;flex-direction:column;align-items:center;gap:16px}
    .btn-primary{display:inline-block;padding:14px 36px;border:1px solid var(--fg);color:var(--bg);background:var(--fg);text-decoration:none;font-size:13px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;transition:background .2s,color .2s}
    .btn-primary:hover{background:transparent;color:var(--fg)}
    .btn-secondary{display:inline-block;color:var(--muted);text-decoration:none;font-size:13px;letter-spacing:.08em;border-bottom:1px solid transparent;transition:color .2s,border-color .2s}
    .btn-secondary:hover{color:var(--fg);border-bottom-color:var(--fg)}
    footer{position:fixed;bottom:28px;left:0;right:0;text-align:center;font-size:11px;color:rgba(240,237,232,0.2);letter-spacing:.1em;text-transform:uppercase}
  </style>
</head>
<body>
  <div class="wordmark">Third Polar Arch</div>
  <div class="divider"></div>
  <h1>High quality<br><strong>creative web design.</strong></h1>
  <p class="sub">Built for businesses that take their presence seriously.</p>
  <div class="cta-group">
    <a href="https://thirdpolararch.com" class="btn-primary">Visit thirdpolararch.com</a>
    <a href="mailto:hello@thirdpolararch.com" class="btn-secondary">hello@thirdpolararch.com</a>
  </div>
  <footer>© Third Polar Arch</footer>
</body>
</html>
