<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kaori Cafe | East Boston Coffee</title>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700&family=Cabinet+Grotesk:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #fdfaf6; --text: #3c2a21; --accent: #8b4513; }
        body { background: var(--bg); color: var(--text); font-family: 'Cabinet Grotesk', sans-serif; margin: 0; display: flex; align-items: center; justify-content: center; min-height: 100vh; text-align: center; }
        .container { padding: 2rem; max-width: 600px; }
        h1 { font-family: 'Syne', sans-serif; font-size: 4rem; margin: 0; text-transform: lowercase; font-style: italic; color: var(--accent); }
        p { font-size: 1.2rem; line-height: 1.6; }
        .cta { margin-top: 2rem; display: inline-block; padding: 1rem 2rem; border-bottom: 2px solid var(--accent); color: var(--accent); text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Kaori Cafe</h1>
        <p>A cozy corner in East Boston. Specialty coffee, seasonal pastries, and community-driven vibes on Meridian Street.</p>
        <a href="#" class="cta">Order Online</a>
    </div>
</body>
</html>
