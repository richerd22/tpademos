<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Salty Pig | Back Bay Bistro</title>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700&family=Cabinet+Grotesk:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #0f0f0f; --text: #ffffff; --accent: #ff4d4d; }
        body { background: var(--bg); color: var(--text); font-family: 'Cabinet Grotesk', sans-serif; margin: 0; display: flex; align-items: center; justify-content: center; min-height: 100vh; text-align: center; }
        .container { padding: 2rem; max-width: 600px; }
        h1 { font-family: 'Syne', sans-serif; font-size: 4rem; margin: 0; text-transform: uppercase; color: var(--accent); }
        p { font-size: 1.2rem; line-height: 1.6; opacity: 0.9; }
        .cta { margin-top: 2rem; display: inline-block; padding: 1rem 2rem; background: var(--accent); color: var(--bg); text-decoration: none; font-weight: bold; text-transform: uppercase; }
    </style>
</head>
<body>
    <div class="container">
        <h1>The Salty Pig</h1>
        <p>Pork-focused bistro in the heart of Back Bay. Artisanal charcuterie, stone-fired pizzas, and the finest selected cheeses from around the world.</p>
        <a href="#" class="cta">Reserve a Table</a>
    </div>
</body>
</html>
