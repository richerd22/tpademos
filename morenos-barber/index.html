<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moreno's Barbershop | Master Barbering</title>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700&family=Cabinet+Grotesk:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #000; --text: #fff; --accent: #f1c40f; }
        body { background: var(--bg); color: var(--text); font-family: 'Cabinet Grotesk', sans-serif; margin: 0; display: flex; align-items: center; justify-content: center; min-height: 100vh; text-align: center; }
        .container { padding: 2rem; max-width: 600px; }
        h1 { font-family: 'Syne', sans-serif; font-size: 4rem; margin: 0; border-bottom: 8px solid var(--accent); display: inline-block; }
        p { font-size: 1.2rem; line-height: 1.6; margin-top: 2rem; }
        .cta { margin-top: 2rem; display: inline-block; padding: 1rem 2rem; background: var(--accent); color: #000; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Moreno's</h1>
        <p>22 years of master barbering. Quality, tradition, and style in Hyde Park.</p>
        <a href="#" class="cta">Join the Queue</a>
    </div>
</body>
</html>
