<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lower Mills Tavern | Dorchester Gastropub</title>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700&family=Cabinet+Grotesk:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #1a1a1a; --text: #f5f5f5; --accent: #d4af37; }
        body { background: var(--bg); color: var(--text); font-family: 'Cabinet Grotesk', sans-serif; margin: 0; display: flex; align-items: center; justify-content: center; min-height: 100vh; text-align: center; }
        .container { padding: 2rem; max-width: 600px; }
        h1 { font-family: 'Syne', sans-serif; font-size: 4rem; margin: 0; text-transform: uppercase; letter-spacing: -2px; color: var(--accent); }
        p { font-size: 1.2rem; line-height: 1.6; opacity: 0.8; }
        .cta { margin-top: 2rem; display: inline-block; padding: 1rem 2rem; border: 2px solid var(--accent); color: var(--accent); text-decoration: none; font-weight: bold; text-transform: uppercase; transition: 0.3s; }
        .cta:hover { background: var(--accent); color: var(--bg); }
    </style>
</head>
<body>
    <div class="container">
        <h1>Lower Mills Tavern</h1>
        <p>A sophisticated but approachable dining experience rooted in fun. Nestled in the heart of Savin Hill, serving Dorchester's favorite comfort food with a premium twist.</p>
        <a href="#" class="cta">View Menu</a>
    </div>
</body>
</html>
